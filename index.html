    <!-- Fraunces (display, serif con carácter propio) + Archivo (sans) — reemplaza
         Playfair Display + Montserrat, la combinación "elegante default" más usada,

         (soft/wonk vía opsz), así que a tamaños grandes gana personalidad sola.
         Space Mono suma un tercer acento SOLO para los "eyebrows" (los kickers
         chicos en mayúscula arriba de cada sección) — contraste editorial tipo
         ficha/etiqueta contra el display cálido de Fraunces, sin tocar nav,
         botones ni precios (siguen en Archivo/Fraunces). -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300..700;1,300..700&family=Archivo:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
